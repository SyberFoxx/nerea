<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nerea avatar</title>
    <link rel="stylesheet" href="avatar.css" />
  </head>
  <body>
    <div id="stage" class="stage" data-panel="closed">
      <section id="panel" class="panel" hidden aria-label="Chat con Nerea">
        <header class="bar" data-tauri-drag-region>
          <span class="name">nerea</span>
          <button id="menu-button" class="icon" type="button" title="Opciones" aria-expanded="false">⋯</button>
          <button id="close-button" class="icon" type="button" title="Cerrar (Esc)">✕</button>
        </header>

        <nav id="menu" class="menu" hidden>
          <button type="button" data-action="talk" id="talk" class="first">Hablar</button>
          <button type="button" data-action="history">Historial completo</button>
          <button type="button" data-action="dock">Anclar a la ventana</button>
          <button type="button" data-action="reset">Borrar memoria</button>
          <button type="button" data-action="voice">Voz</button>
          <button type="button" data-action="update" hidden>Actualizar</button>
          <button type="button" data-action="quit">Cerrar Nerea</button>
        </nav>

        <div id="log" class="log" aria-live="polite">
          <p class="empty">Todavía no hablamos de nada.</p>
        </div>

        <form id="composer" class="composer">
          <label class="sr-only" for="prompt">Mensaje</label>
          <input id="prompt" type="text" placeholder="Decile algo…" autocomplete="off" />
          <button id="send" class="send" type="submit" title="Enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5m0 0l-6 6m6-6l6 6" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button id="stop" class="send stop" type="button" title="Detener" aria-label="Detener"
                  hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" />
            </svg>
          </button>
        </form>
      </section>

      <div id="grip" class="grip">
        <img id="sprite" class="sprite" alt="Nerea" draggable="false" />
      </div>

      <p id="subtitle" class="subtitle" hidden></p>
    </div>
    <script type="module" src="avatar.js"></script>
  </body>
</html>
