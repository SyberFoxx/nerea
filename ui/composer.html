<!doctype html>
<html lang="en">
  <head>

    <title>nerea composer</title>
    <link rel="stylesheet" href="composer.css" />
  </head>
  <body>
    <section id="bubble" class="bubble" hidden aria-live="polite"></section>

  </body>
