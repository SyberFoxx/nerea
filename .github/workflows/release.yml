name: release

# Builds the Linux artifacts on the oldest Ubuntu that Tauri 2 supports, so the
# resulting binary runs on distributions newer than the runner, not only on the
# rolling host it was developed on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential file

      - name: Build the binary
        run: cargo build --release -p nerea-desktop

      - name: Bundle the AppImage
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage

      - name: Package the .deb and the tarball
        run: packaging/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nerea-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
