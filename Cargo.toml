[workspace]
resolver = "3"
members = ["crates/nerea-core", "crates/nerea-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nerea-core = { path = "crates/nerea-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
bytes = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
keyring = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
directories = "6"
toml = "1"
